<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotos - Gym Vym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/core/tokens.css">
<link rel="stylesheet" href="../css/core/base.css">
<link rel="stylesheet" href="../css/core/components.css">
<link rel="stylesheet" href="../css/core/nav.css">
<link rel="stylesheet" href="../css/core/overlays.css">
<link rel="stylesheet" href="../css/core/motion.css">
<link rel="stylesheet" href="../css/core/legacy.css">
<link rel="stylesheet" href="../css/pages/photos.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0A0A0C">
</head>

<body>
<main class="page">
  <div class="container">
    <h2>Fotos de progresso</h2>

    <div class="photo-actions" style="margin-top:16px">
      <button type="button" class="btn btn-primary" id="btnTakePhoto">📷 Tirar foto</button>
      <button type="button" class="btn btn-primary" id="btnGallery">🖼 Galeria/Arquivos</button>
    </div>
    <div class="photo-actions-secondary">
      <button type="button" class="btn btn-secondary" id="btnCompare">Comparar</button>
    </div>

    <input type="file" id="fileInputCamera" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="fileInputGallery" accept="image/*" style="display:none">

    <div class="panel photo-review" id="reviewPanel" style="display:none">
      <img id="reviewImg" alt="Prévia">
      <div class="form-group">
        <label for="photoDate">Data</label>
        <input type="date" id="photoDate">
      </div>
      <div class="form-group">
        <label for="photoNotes">Nota</label>
        <input type="text" id="photoNotes" placeholder="Opcional">
      </div>
      <button type="button" class="btn btn-primary full" id="btnSavePhoto">Salvar</button>
      <button type="button" class="btn btn-secondary full" id="btnCancelPhoto">Cancelar</button>
      <div id="mensagem" class="message"></div>
    </div>

    <div id="emptyState" class="panel" style="display:none;margin-top:16px">
      <div class="gv3-empty">
        <svg class="gv3-empty__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="4.5" width="17" height="15" rx="2" /><circle cx="9" cy="10" r="1.6" /><path d="M4 17l5-5 3.5 3.5L16 12l4 5" /></svg>
        <div class="gv3-empty__title">Nenhuma foto ainda</div>
        <div class="gv3-empty__desc">Registre o ponto de partida. Daqui a 3 meses você vai agradecer.</div>
      </div>
    </div>

    <div class="photo-grid" id="photoGrid"></div>
  </div>
</main>

<div class="compare-bar" id="compareBar" style="display:none">
  <span id="compareCount">0/2 selecionadas</span>
  <button type="button" class="btn btn-primary" id="btnViewCompare" style="margin:0" disabled>Ver comparação</button>
</div>

<div class="photo-viewer" id="photoViewer">
  <button type="button" class="btn-icon" id="btnCloseViewer" style="align-self:flex-end;margin-bottom:12px" aria-label="Fechar">✕</button>
  <img id="viewerImg" alt="Foto">
  <div class="meta">
    <div class="date" id="viewerDate">—</div>
    <div class="notes" id="viewerNotes"></div>
  </div>
  <button type="button" class="btn btn-secondary full" id="btnDeletePhoto">Excluir</button>
</div>

<div class="photo-viewer" id="compareViewer">
  <button type="button" class="btn-icon" id="btnCloseCompare" style="align-self:flex-end;margin-bottom:12px" aria-label="Fechar">✕</button>
  <div class="compare-row">
    <div>
      <img id="compareImg1" alt="Foto mais antiga">
      <div class="meta"><div class="date" id="compareDate1"></div></div>
    </div>
    <div>
      <img id="compareImg2" alt="Foto mais recente">
      <div class="meta"><div class="date" id="compareDate2"></div></div>
    </div>
  </div>
  <div class="compare-diff" id="compareDiff"></div>
</div>

<script type="module" src="../js/photos.js"></script>
</body>
</html>
