<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Gym Vym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/core/tokens.css">
<link rel="stylesheet" href="./css/core/base.css">
<link rel="stylesheet" href="./css/core/components.css">
<link rel="stylesheet" href="./css/core/nav.css">
<link rel="stylesheet" href="./css/core/overlays.css">
<link rel="stylesheet" href="./css/core/motion.css">
<link rel="stylesheet" href="./css/pages/login.css">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0A0A0C">
</head>

<body>
<main class="gv3-auth-page">
  <section class="gv3-card gv3-card--raised gv3-auth-card gv3-anim-in">
    <div class="gv3-brand"><span>GYM</span><span class="vym">VYM</span></div>
    <p>Entre para registrar seu treino</p>

    <div class="gv3-field">
      <label for="email">E-mail</label>
      <input type="email" id="email" class="gv3-input" placeholder="seu@email.com" autocomplete="email">
    </div>

    <div class="gv3-field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" class="gv3-input" placeholder="Sua senha" autocomplete="current-password">
    </div>

    <button type="button" class="gv3-btn gv3-btn--primary gv3-btn--full" id="btnLogin">Entrar</button>
    <button type="button" class="gv3-btn gv3-btn--secondary gv3-btn--full" id="btnCadastro" style="margin-top:8px">Cadastrar</button>

    <div id="mensagem" class="message"></div>
  </section>
</main>

<script type="module" src="./js/auth.js"></script>
</body>
</html>
