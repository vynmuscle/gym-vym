<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Vym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/core/tokens.css">
<link rel="stylesheet" href="./css/core/base.css">
<link rel="stylesheet" href="./css/core/components.css">
<link rel="stylesheet" href="./css/core/overlays.css">
<link rel="stylesheet" href="./css/core/motion.css">
<link rel="stylesheet" href="./css/pages/dashboard.css">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0A0A0C">
</head>

<body>
<main class="gv3-page">
  <header class="gv3-header">
    <div class="gv3-brand"><span>GYM</span><span class="vym">VYM</span></div>
  </header>

  <div class="gv3-greeting">
    <h1 id="greetingName">Fala!</h1>
    <p id="greetingDate">—</p>
    <div class="gv3-chip" id="leagueChip" style="margin-top:8px">
      <span id="leagueEmoji"></span> <span id="leagueLabel">—</span>
    </div>
  </div>

  <div class="gv3-card gv3-anim-in" style="margin-top:14px">
    <div class="gv3-section-title">Sua semana</div>
    <div class="gv3-week-row" id="weekRow">
      <div class="gv3-skeleton" style="grid-column:1/-1;height:56px"></div>
    </div>
  </div>

  <div id="heroSection" style="margin-top:14px">
    <div class="gv3-skeleton" style="height:150px;border-radius:18px"></div>
  </div>

  <div class="gv3-card gv3-anim-in" id="insightCard" style="margin-top:14px;display:none">
    <div class="gv3-section-title">Insight do dia</div>
    <div id="insightText" style="font-size:14px;line-height:1.4;color:var(--gv3-text-secondary)"></div>
  </div>

  <div class="gv3-card gv3-card--raised gv3-anim-in" id="ringSection" style="margin-top:14px;display:flex;align-items:center;gap:16px">
    <div class="gv3-ring-wrap" id="ringHost"></div>
    <div class="gv3-progress-info">
      <div class="big" id="progressBig">—</div>
      <div class="sub" id="progressSub">—</div>
      <div class="gv3-streak"><span id="streakIcon"></span><span id="streakValue" class="gv3-mono">0</span>&nbsp;dias de sequência</div>
    </div>
  </div>

  <div class="gv3-shortcut-grid" style="margin-top:14px">
    <a href="./pages/diet.html" class="gv3-card gv3-anim-in" id="nutritionCard">
      <div class="gv3-section-title">Nutrição hoje</div>
      <div id="nutritionBody"><div class="gv3-skeleton" style="height:28px"></div></div>
    </a>
    <a href="./pages/body.html" class="gv3-card gv3-anim-in" id="bodyCard">
      <div class="gv3-section-title">Corpo</div>
      <div id="bodyBody"><div class="gv3-skeleton" style="height:28px"></div></div>
    </a>
  </div>

  <div style="margin-top:14px">
    <div class="gv3-section-title">Recuperação</div>
    <div class="gv3-recovery-strip" id="recoveryStrip">
      <div class="gv3-skeleton" style="height:76px"></div>
      <div class="gv3-skeleton" style="height:76px"></div>
      <div class="gv3-skeleton" style="height:76px"></div>
      <div class="gv3-skeleton" style="height:76px"></div>
    </div>
  </div>

  <div style="margin-top:14px">
    <div class="gv3-section-title">Atividade recente</div>
    <div class="gv3-card" id="recentActivityCard">
      <div class="gv3-skeleton" style="height:20px;margin:14px 0"></div>
      <div class="gv3-skeleton" style="height:20px;margin:14px 0"></div>
      <div class="gv3-skeleton" style="height:20px;margin:14px 0"></div>
    </div>
  </div>
</main>

<button type="button" class="gv3-ai-fab" id="btnAskAI" aria-label="Perguntar à IA"></button>

<script type="module" src="./js/index.js"></script>
</body>
</html>
