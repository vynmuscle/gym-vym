<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Vym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/layout.css">
<link rel="stylesheet" href="./css/components.css">
<link rel="stylesheet" href="./css/mobile.css">
<link rel="stylesheet" href="./css/train.css">
<link rel="stylesheet" href="./css/design-system/tokens.css">
<link rel="stylesheet" href="./css/design-system/components.css">
<link rel="stylesheet" href="./css/design-system/overlays.css">
<link rel="stylesheet" href="./css/design-system/motion.css">
<link rel="stylesheet" href="./css/design-system/identity.css">
<link rel="stylesheet" href="./css/dashboard.css">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b0d10">
</head>

<body>
<main class="page">
  <div class="container">
    <header style="padding:0 0 4px">
      <div class="brand-mark" style="font-size:16px"><span class="gym">GYM</span><span class="vym">VYM</span></div>
      <div class="greeting">
        <h1 id="greetingName">Fala!</h1>
        <p id="greetingDate">—</p>
        <div class="gv-chip" id="leagueChip" style="margin-top:8px">
          <span id="leagueEmoji"></span> <span id="leagueLabel">—</span>
        </div>
      </div>
    </header>

    <div class="gv-card gv-anim-card" style="margin-top:14px;padding:14px">
      <div class="section-title">Sua semana</div>
      <div class="week-row" id="weekRow">
        <div class="gv-skeleton" style="grid-column:1/-1;height:56px;border-radius:12px"></div>
      </div>
    </div>

    <div id="heroSection" style="margin-top:14px">
      <div class="gv-skeleton" style="height:150px;border-radius:18px"></div>
    </div>

    <div class="gv-card gv-anim-card" id="insightCard" style="margin-top:14px;padding:14px;display:none">
      <div class="section-title">Insight do dia</div>
      <div id="insightText" style="font-size:14px;line-height:1.4"></div>
    </div>

    <div class="gv-card gv-anim-card" id="ringSection" style="margin-top:14px;padding:16px 14px;display:flex;align-items:center;gap:16px">
      <div class="ring" id="ringHost"></div>
      <div class="progress-info">
        <div class="big" id="progressBig">—</div>
        <div class="sub" id="progressSub">—</div>
        <div class="streak"><span class="fire">🔥</span> <span id="streakValue" class="gv-text-gradient">0</span> dias de sequência</div>
      </div>
    </div>

    <div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <a href="./pages/diet.html" class="gv-card gv-anim-card" id="nutritionCard" style="padding:14px;text-decoration:none;color:inherit;display:block">
        <div class="section-title">Nutrição hoje</div>
        <div id="nutritionBody"><div class="gv-skeleton" style="height:28px;border-radius:8px"></div></div>
      </a>
      <a href="./pages/body.html" class="gv-card gv-anim-card" id="bodyCard" style="padding:14px;text-decoration:none;color:inherit;display:block">
        <div class="section-title">Corpo</div>
        <div id="bodyBody"><div class="gv-skeleton" style="height:28px;border-radius:8px"></div></div>
      </a>
    </div>

    <div style="margin-top:14px">
      <div class="section-title">Recuperação</div>
      <div class="recovery-strip" id="recoveryStrip">
        <div class="gv-skeleton" style="height:76px;border-radius:12px"></div>
        <div class="gv-skeleton" style="height:76px;border-radius:12px"></div>
        <div class="gv-skeleton" style="height:76px;border-radius:12px"></div>
        <div class="gv-skeleton" style="height:76px;border-radius:12px"></div>
      </div>
    </div>

    <div style="margin-top:14px">
      <div class="section-title">Atividade recente</div>
      <div class="gv-card" id="recentActivityCard" style="padding:4px 14px">
        <div class="gv-skeleton" style="height:20px;border-radius:6px;margin:14px 0"></div>
        <div class="gv-skeleton" style="height:20px;border-radius:6px;margin:14px 0"></div>
        <div class="gv-skeleton" style="height:20px;border-radius:6px;margin:14px 0"></div>
      </div>
    </div>
  </div>
</main>

<button type="button" class="gv-fab" id="btnAskAI" aria-label="Perguntar à IA">✨</button>

<script type="module" src="./js/index.js"></script>
</body>
</html>
